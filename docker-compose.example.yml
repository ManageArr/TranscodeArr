# TranscodeArr on a QNAP with an NVIDIA card and Container Station.
# The runtime name is Container Station's own registration: "nvidia-runtime"
# (not the "nvidia" most guides assume - check `docker info | grep -i runtimes`).
services:
  transcodearr:
    build: .
    container_name: transcodearr
    runtime: nvidia-runtime
    ports:
      - "8484:8484"
    volumes:
      - /share/NAS/Media:/media
      - /share/NAS/Containers/transcodearr:/config
    environment:
      # compute is required: ffmpeg's NVENC initializes through CUDA.
      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
      # The bootstrap key - your first way in. Mint per-consumer keys in the UI
      # afterwards; this one keeps working and cannot be revoked from there.
      TRANSCODEARR_TOKEN: "change-me"
      # The volume mounts themselves, so this one genuinely belongs in env.
      MEDIA_ROOTS: "/media"
      # Everything below only SEEDS a first boot. Once a value is saved in the
      # UI it is stored in the database and this is ignored - otherwise a
      # recreate with a stale file would silently undo what you changed.
      WATCH_ROOTS: "/media/Temp/transcodearr-canary"
      QUALITY: "24"
      TRASH_KEEP_DAYS: "7"
    restart: unless-stopped
