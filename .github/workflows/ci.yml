# The rules that keep media safe are pure functions with tests. This runs them.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: python -m unittest discover tests -v
      - name: Every module imports cleanly
        # A syntax error in a module the tests do not import would otherwise
        # only surface when the container starts on the NAS.
        run: python -c "import sys; sys.path.insert(0,'app'); import core, store, arrs, system, web, main"

  image:
    # Nothing above this job reads the Dockerfile, so a typo in the jellyfin
    # repo line or an apt purge that takes something the app needs used to pass
    # green here and only fail once a user pulled the image. Build it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build -t transcodearr:ci .
